name: Publish sync image

# Builds sync/ into ghcr.io/<owner>/gw2-homestead-sync, the image the home server pulls (see
# sync/README.md). GHCR makes a new package private; it stays private unless changed in the
# package's settings. Data-only pushes don't touch sync/, so they don't rebuild the image.
on:
  push:
    branches:
      - main
    paths:
      - 'sync/**'
      - '.github/workflows/sync_image.yml'
  schedule:
    # Monthly, rebuilt from scratch so the image picks up Node and Debian security fixes.
    - cron: '17 6 1 * *'
  workflow_dispatch:

concurrency:
  group: sync-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gw2-homestead-sync

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pushing with GITHUB_TOKEN links the package to this repo, so this workflow can keep
      # pushing to it. Skipped under act (local runs), which build without pushing.
      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` for the server to pull, plus `sha-<commit>` to roll back to.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=gw2-homestead-sync
            org.opencontainers.image.description=Hourly GW2 homestead decoration sync for the catalog site

      # Unraid runs on x86-64. The GitHub Actions layer cache isn't available under act.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: sync
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ !env.ACT && 'type=gha' || '' }}
          cache-to: ${{ !env.ACT && 'type=gha,mode=max' || '' }}
