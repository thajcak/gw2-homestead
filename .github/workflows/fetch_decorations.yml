name: Update and Fetch Decorations and Categories

on:
  schedule:
    # Hourly, off the top of the hour: GitHub delays or drops many runs scheduled at minute 0
    # (main fired only every 5-7 hours on '0 * * * *').
    - cron: '23 * * * *'
  workflow_dispatch: # Allows for manual trigger of the workflow
    inputs:
      allow_large_drop:
        description: 'Continue even if the GW2 API lists many fewer decorations than are stored'
        type: boolean
        default: false
      ids:
        description: 'Only query the wiki for these decoration IDs (comma-separated); empty = all'
        type: string
        default: ''

# Runs queue instead of overlapping, so two runs never commit on top of each other.
concurrency:
  group: fetch-decorations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-and-fetch-decorations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # jq (used by the wiki recipe parser) is preinstalled on GitHub's runners and act's image.
      - name: Check required tools
        run: jq --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # sharp resizes downloaded preview images before they are committed.
      - name: Install dependencies
        run: npm ci

      # Fetches the GW2 API (with retries, a full-response check and an item-count guard),
      # merges stored enrichment, queries the wiki, syncs content files and localizes images.
      - name: Fetch, enrich and sync decorations
        env:
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop && '--allow-large-drop' || '' }}
          WIKI_IDS: ${{ inputs.ids }}
        run: node scripts/run-fetch-decorations.mjs $ALLOW_LARGE_DROP ${WIKI_IDS:+--ids "$WIKI_IDS"}

      - name: Commit updated decorations and categories
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ src/data/ src/assets/decorations/ public/images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update decoration data and changelog"
            git show --stat --format='%h %s' HEAD | tail -n 25
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebase onto anything that landed during the run, so the run's work isn't lost to a
      # rejected push. Retries once. Skipped under act (local runs), so a local test never pushes.
      - name: Push
        id: push
        if: steps.commit.outputs.changed == 'true' && !env.ACT
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for attempt in 1 2; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            [ "$attempt" -eq 1 ] && sleep 15
          done
          exit 1

  # Deploy only when this run pushed a data commit.
  deploy:
    needs: update-and-fetch-decorations
    if: needs.update-and-fetch-decorations.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update-and-fetch-decorations.outputs.sha }}
