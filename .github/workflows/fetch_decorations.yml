name: Update and Fetch Decorations and Categories

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows for manual trigger of the workflow
    inputs:
      allow_large_drop:
        description: 'Continue even if the GW2 API lists many fewer decorations than are stored'
        type: boolean
        default: false

jobs:
  update-and-fetch-decorations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xmlstarlet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fetches the GW2 API (with retries, a full-response check and an item-count guard),
      # merges stored enrichment, queries the wiki, syncs content files and localizes images.
      - name: Fetch, enrich and sync decorations
        env:
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop && '--allow-large-drop' || '' }}
        run: node scripts/run-fetch-decorations.mjs $ALLOW_LARGE_DROP

      - name: Commit and push updated decorations and categories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ src/assets/decorations/ public/images/
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update decoration data and changelog"
            git push
          fi