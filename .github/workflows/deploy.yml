name: Deploy Astro site to GitHub Pages

# The sync container (sync/) pushes its data commits with its own key, so they deploy through
# `push`. The manual fetch workflow calls this one (workflow_call) only when it pushed a data
# commit; pushes by GITHUB_TOKEN don't trigger `push`, so that commit isn't deployed twice.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (the caller pushed it after this run started)'
        type: string
        required: false
        default: ''

# A new run waits for the current one instead of cancelling a deploy partway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two steps because any `ref:` (even empty) makes act fetch from GitHub instead of
      # copying the local working tree.
      - name: Checkout repository
        if: ${{ !inputs.ref }}
        uses: actions/checkout@v4

      - name: Checkout the commit the fetch run pushed
        if: ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Astro keeps optimized images in node_modules/.astro and reuses an entry while its
      # source and transform are unchanged. Restored after npm ci, which deletes node_modules.
      # A data change makes a new key; restore-keys start it from the latest cache, so only
      # new or changed images are re-optimized.
      - name: Restore Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-

      - name: Build Astro site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # Pages steps need GitHub's OIDC token and Pages API, so they are skipped under act.
      - name: Setup Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Summarize build (act)
        if: ${{ env.ACT }}
        run: |
          echo "dist: $(du -sh dist | cut -f1), $(find dist -type f | wc -l) files"
          test -f dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Local act runs pass an event payload with "act": true (see .github/act/).
    if: ${{ !github.event.act }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
