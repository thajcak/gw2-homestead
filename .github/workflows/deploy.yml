name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update and Fetch Decorations and Categories
    types:
      - completed
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # Pages steps need GitHub's OIDC token and Pages API, so they are skipped under act.
      - name: Setup Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Summarize build (act)
        if: ${{ env.ACT }}
        run: |
          echo "dist: $(du -sh dist | cut -f1), $(find dist -type f | wc -l) files"
          test -f dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Local act runs pass an event payload with "act": true (see .github/act/).
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !github.event.act
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
