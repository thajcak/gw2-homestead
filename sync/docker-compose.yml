# The decoration sync on Unraid (or any Docker host). See sync/README.md.
#
#   docker compose up -d       pull the image and start the hourly schedule
#   docker compose pull        fetch a newer image (then `up -d` again)
#   docker compose logs -f     follow the runs
#   docker compose exec sync sync-once --ids 1,2   run once now
#   http://<server>:8080       the status page: last run, next run and what each run found
#
# The image is private: `docker login ghcr.io` first (see sync/README.md).
services:
  sync:
    image: ghcr.io/thajcak/gw2-homestead-sync:latest
    container_name: gw2-homestead-sync
    restart: unless-stopped
    environment:
      # REPO_URL defaults to git@github.com:thajcak/gw2-homestead.git (pushes with the deploy key).
      # For a token instead, set REPO_URL to https://github.com/thajcak/gw2-homestead.git and:
      # GITHUB_TOKEN: github_pat_...
      SYNC_MINUTE: "30"
      RUN_ON_START: "false"
      PUSH: "true"
      PUID: "99"
      PGID: "100"
      GIT_USER_NAME: gw2-homestead-sync
      GIT_USER_EMAIL: gw2-homestead-sync@localhost
    ports:
      # The status page, at http://<server>:8080. It has no login: keep it on your own network.
      - "8080:8080"
    volumes:
      # Holds the clone, the deploy key (deploy_key), the run history and the sync's git config.
      - /mnt/user/appdata/gw2-homestead-sync:/data
